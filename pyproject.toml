[build-system]
requires = ["hatchling<1.32.0"]
build-backend = "hatchling.build"

[project]
name = "safe_json"
version = "1.0.1"
description = "Robustly extract and lightly repair JSON from messy LLM responses"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "safe_json contributors"}
]
keywords = ["json", "llm", "parsing", "extraction", "repair"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.urls]
Homepage = "https://github.com/example/safe_json"
Repository = "https://github.com/example/safe_json"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
